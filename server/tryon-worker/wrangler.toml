name = "lagi-tryon"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Run the Worker next to Google's US region instead of the visitor's nearest Cloudflare location.
# Gemini's image model refuses calls from some locations ("User location is not supported for the
# API use") — e.g. when a visitor in Korea is served from a nearby Cloudflare data centre.
[placement]
mode = "targeted"
region = "gcp:us-central1"

[vars]
# Gemini image model. If Google renames it, change this and redeploy (see README).
GEMINI_MODEL = "gemini-2.5-flash-image"
# The LAGI site. Only these origins may call the Worker or supply product images.
# Local development does not use the production Worker's list; run it with your own origin instead:
#   npx wrangler dev --var ALLOWED_ORIGINS:http://localhost:5173
ALLOWED_ORIGINS = "https://ewq122334455-tech.github.io"
# Account deletion (POST /auth/delete) stays off until the owner picks what happens to a member's
# reviews: "keep-anonymous" (kept without name/email) or "delete". Uncomment one when decided.
# WITHDRAW_REVIEW_POLICY = "keep-anonymous"
# Published product data. The Worker re-reads prices from here for every order (never from the browser).
PRODUCTS_BASE_URL = "https://ewq122334455-tech.github.io/lagi-ar/products/"
# Realtime try-on: sessions per day for the whole site (each up to 20 s, about $0.40 at $0.02/s).
REALTIME_DAILY_SESSIONS = "100"

# Member accounts and login sessions. With no id, `wrangler deploy` creates the namespace on first deploy.
[[kv_namespaces]]
binding = "USERS"

# On-site orders (address + payment). Same auto-provisioning as USERS.
[[kv_namespaces]]
binding = "ORDERS"

# Product cut-outs for the AI fitting (product alone on white, one per photo). Auto-created on deploy.
[[kv_namespaces]]
binding = "MEDIA"

# Gemini relay: a Durable Object created in the western US, so calls to Gemini always leave from
# there (Gemini refuses image calls from some visitor locations).
[[durable_objects.bindings]]
name = "RELAY"
class_name = "GeminiRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiRelay"]

# Optional: Cloudflare Rate Limiting for log-ins (in addition to the per-email lock kept in KV).
# Enable only after checking it is available on the account; without it the KV lock still applies.
# [[ratelimits]]
# name = "LOGIN_LIMIT"
# namespace_id = "1001"
# simple = { limit = 5, period = 60 }
