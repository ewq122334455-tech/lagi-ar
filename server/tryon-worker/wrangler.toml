name = "lagi-tryon"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Run the Worker next to Google's US region instead of the visitor's nearest Cloudflare location.
# Gemini's image model refuses calls from some locations ("User location is not supported for the
# API use") — e.g. when a visitor in Korea is served from a nearby Cloudflare data centre.
[placement]
mode = "targeted"
region = "gcp:us-central1"

[vars]
# Gemini image model. If Google renames it, change this and redeploy (see README).
GEMINI_MODEL = "gemini-2.5-flash-image"
# The LAGI site (and local dev). Only these origins may call the Worker or supply product images.
ALLOWED_ORIGINS = "https://ewq122334455-tech.github.io,http://localhost:5173,http://localhost:4173"
# Published product data. The Worker re-reads prices from here for every order (never from the browser).
PRODUCTS_BASE_URL = "https://ewq122334455-tech.github.io/lagi-ar/products/"

# Member accounts and login sessions. With no id, `wrangler deploy` creates the namespace on first deploy.
[[kv_namespaces]]
binding = "USERS"

# On-site orders (address + payment). Same auto-provisioning as USERS.
[[kv_namespaces]]
binding = "ORDERS"

# Product cut-outs for the AI fitting (product alone on white, one per photo). Auto-created on deploy.
[[kv_namespaces]]
binding = "MEDIA"

# Gemini relay: a Durable Object created in the western US, so calls to Gemini always leave from
# there (Gemini refuses image calls from some visitor locations).
[[durable_objects.bindings]]
name = "RELAY"
class_name = "GeminiRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiRelay"]
