<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Brand fonts: self-hosted files (see public/fonts/brand-fonts.css). -->
    <link rel="stylesheet" href="fonts/brand-fonts.css" />
    <!-- Brand fonts via Adobe Fonts: set VITE_ADOBE_FONTS_KIT (a Web Project ID) to load Posterama 2001. -->
    <script type="module">
      const kit = import.meta.env.VITE_ADOBE_FONTS_KIT;
      if (kit) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `https://use.typekit.net/${kit}.css`;
        document.head.appendChild(link);
      }
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <title>LAGI — Look Closer</title>
    <meta name="description" content="LAGI 디지털 프로덕트 익스피리언스. 제품을 발견하고, 3D로 살펴보고, AR로 실물과 연결하세요." />
    <meta property="og:title" content="LAGI — Look Closer" />
    <meta property="og:description" content="LAGI 디지털 프로덕트 익스피리언스. 제품을 발견하고, 3D로 살펴보고, AR로 실물과 연결하세요." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
