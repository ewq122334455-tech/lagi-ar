# Local-only test config (never deployed): the real Worker in real workerd + a real Durable Object + a LOCAL mock of the Decart token API.
name = "rt-lease-test"
main = "../../../../server/tryon-worker/src/index.ts"
compatibility_date = "2025-01-01"
[vars]
GEMINI_MODEL = "m"
GEMINI_API_KEY = "dummy-not-a-real-key"
DECART_API_KEY = "dummy-not-a-real-key"
DECART_BASE_URL = "http://127.0.0.1:9912"
ALLOWED_ORIGINS = "http://127.0.0.1:9912"
ADMIN_TOKEN = "local-admin-token"
REALTIME_DAILY_SESSIONS = "50"
REALTIME_MAX_CONCURRENT = "3"
[[kv_namespaces]]
binding = "MEDIA"
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]
