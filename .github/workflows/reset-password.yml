# Owner-only password reset for a member account (the site has no email reset yet).
# 1) Add repository secrets RESET_EMAIL (the account email) and RESET_PASSWORD (the new password, 8+ chars).
# 2) Actions → "Reset member password" → Run workflow.
# 3) Delete RESET_PASSWORD afterwards.
name: Reset member password

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set the new password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESET_EMAIL: ${{ secrets.RESET_EMAIL }}
          RESET_PASSWORD: ${{ secrets.RESET_PASSWORD }}
        run: node .github/scripts/reset-password.mjs
