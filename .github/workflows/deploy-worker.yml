# Deploys the AI / members / orders server (server/tryon-worker) to Cloudflare whenever it changes on main.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers").
# Without it the job only prints a notice — the website deploy is not affected.
# Optional secrets, uploaded to the Worker when present: DECART_API_KEY (realtime try-on) and
# REALTIME_UNLIMITED (comma-separated member emails with no daily realtime limit).
name: Deploy AI server (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['server/tryon-worker/**']
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Cloudflare token
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DECART_API_KEY: ${{ secrets.DECART_API_KEY }}
          REALTIME_UNLIMITED: ${{ secrets.REALTIME_UNLIMITED }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the AI server deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          # Only the optional secrets that are actually set are uploaded (wrangler-action fails on an empty one).
          {
            echo "secrets<<EOF"
            for name in DECART_API_KEY REALTIME_UNLIMITED; do
              if [ -n "${!name}" ]; then echo "$name"; fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        if: steps.token.outputs.ok == 'true'
        env:
          DECART_API_KEY: ${{ secrets.DECART_API_KEY }}
          REALTIME_UNLIMITED: ${{ secrets.REALTIME_UNLIMITED }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/tryon-worker
          wranglerVersion: '4'
          secrets: ${{ steps.token.outputs.secrets }}
          command: deploy
